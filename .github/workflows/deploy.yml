name: Deploy to Hostinger VPS (unused — Hostinger's own GitHub auto-deploy is what actually runs)

# Manual-only. The site is actually hosted on Hostinger's own "Websites"
# Node.js product, which auto-deploys on push via its own GitHub App
# integration — unrelated to this workflow. This SSH/PM2/Nginx approach
# was the original plan (see DEPLOY.md) before switching to that, and the
# VPS_* secrets it needs were never configured, so it failed on every push
# and spammed failure emails. Kept only for workflow_dispatch in case a
# real self-managed VPS is set up later; see DEPLOY.md for the real setup.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}
            git pull origin main
            npm ci
            npm run build
            pm2 reload ecosystem.config.js --update-env
