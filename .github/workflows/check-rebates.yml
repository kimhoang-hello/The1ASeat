name: Check FinlyWealth rebate amounts

# Calls the deployed site's /api/check-rebates endpoint, which reads the
# current rebate off each card's FinlyWealth page and writes it back to
# Contentful when it has changed. FinlyWealth moves these figures without
# notice, and a rebate on the card that no longer matches what the reader
# actually gets is worse than showing none.
#
# Route này canh HAI chỗ, vì con số rebate nằm ở hai chỗ: field `rebateVi`
# (badge trên ảnh thẻ) và câu "HOT TIP: ... nhận thêm $140 rebate." viết tay
# trong `editorsTakeVi`. Trước 01/09/2026 nó chỉ canh chỗ đầu, và chỗ thứ hai
# trôi trong im lặng — đo hôm đó: 3/10 thẻ có rebate đang lệch, tệ nhất hứa dư
# $75. Nay route vá phần chữ trong cùng lần ghi, và báo ra `errors` khi hai số
# đá nhau mà FinlyWealth không đổi gì (ca gõ nhầm tay trong Contentful).
#
# Không cần thêm step nào ở đây: runner không có token Contentful, còn server
# thì có. Bản chạy tay của cùng phép so là `npm run audit:rebate-prose`.
on:
  schedule:
    # Hai lượt mỗi ngày, cách nhau 12 tiếng. Một lượt là không đủ: 04/09/2026
    # FinlyWealth nâng rebate thẻ Scotiabank® Gold American Express® từ $150
    # lên $200 SAU khi lượt trong ngày đã chạy, nên site hứa thiếu $50 cho
    # người đọc suốt phần còn lại của ngày, và phải chạy tay mới thấy.
    #
    # Giờ ghi ở đây là giờ SỚM NHẤT, không phải giờ chạy: cron của GitHub
    # Actions xếp hàng chứ không đúng phút, và ba lượt 02-04/09/2026 đều nổ
    # lúc ~12:55 UTC dù đặt 8:30. Đó là thêm một lý do chạy hai lượt — lượt
    # nào bị đẩy trễ thì lượt kia vẫn còn.
    #
    # Chạy lại an toàn và rẻ: route tự đối chiếu với bản đã publish trước khi
    # ghi, nên lượt thứ hai của một ngày không đổi gì sẽ chỉ đọc rồi thôi
    # (~15 giây, 10 thẻ).
    - cron: "30 8 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gọi check-rebates
        # Toàn bộ phần curl, thử lại và ghi log nằm trong action dùng
        # chung — ba workflow này trước đây chép lại cùng một khối, và
        # khối đó còn mang nguyên cùng một comment nói về FinlyWealth kể
        # cả ở job không đụng gì tới FinlyWealth.
        uses: ./.github/actions/call-site-endpoint
        with:
          path: /api/check-rebates
          secret: ${{ secrets.EXPIRE_OFFERS_SECRET }}
