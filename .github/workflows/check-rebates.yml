name: Check FinlyWealth rebate amounts

# Calls the deployed site's /api/check-rebates endpoint, which reads the
# current rebate off each card's FinlyWealth page and writes it back to
# Contentful when it has changed. FinlyWealth moves these figures without
# notice, and a rebate on the card that no longer matches what the reader
# actually gets is worse than showing none.
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-rebates endpoint
        # -sfS chứ không phải -sf: -s một mình nuốt luôn lý do hỏng, nên hai
        # lần thất bại 20/08 và 21/08 chỉ để lại đúng "exit code 28" trong log
        # mà không nói vì sao. --retry vì cả hai lần đều là timeout ở phút thứ
        # 4,5 — route này gọi ra ngoài (FinlyWealth, YouTube, Contentful) nên
        # thỉnh thoảng chạm trần thời gian của Hostinger; gọi lại là xong. Gọi
        # lại an toàn: route tự đối chiếu với Contentful trước khi ghi, chạy
        # hai lần không tạo trùng.
        run: |
          curl -sfS --retry 3 --retry-all-errors --retry-delay 30 --max-time 300 \
            -X POST "https://ghe1a.com/api/check-rebates" \
            -H "Authorization: Bearer ${{ secrets.EXPIRE_OFFERS_SECRET }}"
