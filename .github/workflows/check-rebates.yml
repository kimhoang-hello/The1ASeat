name: Check FinlyWealth rebate amounts

# Giữ cho con số rebate trên trang thẻ khớp với thứ FinlyWealth đang thật sự
# trả. Chi tiết phép so nằm trong `src/lib/check-rebates.ts`.
#
# Job này CHẠY THẲNG TRONG RUNNER, không gọi https://ghe1a.com nữa. Lý do đầy
# đủ ở đầu `scripts/check-rebates.mts`; tóm tắt: edge Hostinger chặn IP runner —
# 403 ở lượt 04/09 và 05/09, rồi từ 08/09 là chặn thẳng ở tầng TCP (`curl (28)`,
# 268 giây một lượt, 5 lượt, ~25 phút runner cho một job không chạy nổi dòng
# nào), trong khi site vẫn trả 200 trong 0.4 giây khi gọi từ máy nhà. Hai ngày
# liền mỗi ngày mất một trong hai lượt.
#
# Ba job còn lại (`expire-offers`, `sync-videos`, `offer-history`) vẫn đi qua
# ghe1a.com và vẫn dính đúng rủi ro đó — chưa chuyển vì chúng cần những thứ
# khác nữa từ server, không chỉ token Contentful.
on:
  schedule:
    # Hai lượt mỗi ngày, cách nhau 12 tiếng. Một lượt là không đủ: 04/09/2026
    # FinlyWealth nâng rebate thẻ Scotiabank® Gold American Express® từ $150
    # lên $200 SAU khi lượt trong ngày đã chạy, nên site hứa thiếu $50 cho
    # người đọc suốt phần còn lại của ngày, và phải chạy tay mới thấy.
    #
    # Giờ ghi ở đây là giờ SỚM NHẤT, không phải giờ chạy: cron của GitHub
    # xếp hàng, và đo 02–09/09/2026 thì lượt 8:30 UTC đều nổ quanh 12:55–13:10
    # UTC. Đừng suy ra "job không chạy" khi chưa thấy nó nổ đúng giờ.
    - cron: "30 8 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # Ba secret Contentful sống trong environment `contentful-write`, KHÔNG
    # phải secret cấp repo, và environment đó chỉ cho phép branch `main`.
    #
    # Vì sao phải vậy: repo này PUBLIC và `workflow_dispatch` nhận `ref` là
    # branch/tag bất kỳ. Với secret cấp repo, ai có quyền write chỉ cần đẩy một
    # branch sửa `scripts/check-rebates.mts` rồi dispatch vào chính branch đó —
    # và mã tuỳ ý chạy với `CONTENTFUL_MANAGEMENT_TOKEN`, token DUY NHẤT có
    # quyền ghi Contentful. Buộc theo branch thì GitHub chặn cả job trước khi
    # runner nhận secret.
    #
    # Nó KHÔNG ngăn được người đã có quyền write: `main` chưa có branch
    # protection nên push thẳng vào `main` là đường ngắn hơn. Xem AGENTS.md,
    # mục 09/09/2026 — đã cân nhắc và cố ý không mở rộng sang các workflow
    # khác.
    #
    # Đây cũng là lý do KHÔNG bỏ `workflow_dispatch` cho xong: chạy tay trên
    # `main` là cách duy nhất kiểm được chính đường chạy trong runner (gọi
    # route `/api/check-rebates` chỉ kiểm được đường trên server).
    environment: contentful-write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Đối chiếu rebate thẻ với FinlyWealth
        env:
          # CDA — đọc bản ĐÃ PUBLISH, tức thứ người đọc đang nhìn thấy.
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          # CMA — ghi số mới rồi publish.
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
        run: npm run job:check-rebates
