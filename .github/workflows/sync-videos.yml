name: Sync new YouTube videos to Contentful

# Calls the deployed site's /api/sync-videos endpoint, which checks
# @HoangLeCA's YouTube RSS feed for videos not yet posted as a blogPost
# entry and creates + publishes one automatically for each new video.
on:
  schedule:
    # Bốn lượt/ngày như cũ, nhưng lệch khỏi 00:00 UTC. Lượt "0 0" (GitHub
    # xếp hàng nên nổ lúc ~02:54–03:31 UTC) đỏ 14/18 đêm từ 08/09 đến
    # 25/09/2026, lần nào cũng là YouTube trả 404 cho chính feed Atom, suốt cả
    # 2,5 phút thử lại. Ba lượt còn lại trong cùng khoảng đó chưa từng gặp 404
    # nào và lượt kế tiếp lần nào cũng xanh — tức nhiều khả năng là khung giờ
    # (chưa rõ vì sao), không phải channel ID sai. Chưa chắc lệch giờ là chữa
    # được; nếu 404 đi theo sang khung mới thì giả thuyết khung giờ sai.
    # Một job đỏ gần như mỗi đêm vì lý do không ai sửa được
    # thì chẳng mấy chốc không ai còn đọc nó nữa. Phút 17 để khỏi rơi vào đỉnh
    # đầu giờ của hàng đợi cron. Xem AGENTS.md, mục 25/09/2026.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gọi sync-videos
        # Toàn bộ phần curl, thử lại và ghi log nằm trong action dùng
        # chung — ba workflow này trước đây chép lại cùng một khối, và
        # khối đó còn mang nguyên cùng một comment nói về FinlyWealth kể
        # cả ở job không đụng gì tới FinlyWealth.
        uses: ./.github/actions/call-site-endpoint
        with:
          path: /api/sync-videos
          secret: ${{ secrets.SYNC_VIDEOS_SECRET }}
